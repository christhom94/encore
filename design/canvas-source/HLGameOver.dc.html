<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Encore game over</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Schibsted+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #E3E1DC; font-family: 'Schibsted Grotesk', sans-serif; color: #1C1C1F; display: flex; flex-direction: column; padding: 52px 16px 22px">

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<a href="HLHome.dc.html" aria-label="Close and go home" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; border: 2.5px solid #1C1C1F; background: #F8F6F2; display: flex; align-items: center; justify-content: center; color: #1C1C1F">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
<span style="font-family: 'Anton', sans-serif; font-size: 26px; line-height: 1.05; text-transform: uppercase; letter-spacing: 0.02em">Metallica</span>
<div style="width: 44px"></div>
</div>

<div style="margin-top: 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">

<div style="grid-column: span 2; height: 196px; box-sizing: border-box; margin-right: 5px; border-radius: 24px; border: 2.5px solid #1C1C1F; background: #2B2B30; color: #F8F6F2; box-shadow: 5px 5px 0 #E4572E; padding: 16px 20px; display: flex; flex-direction: column; justify-content: space-between">
<span style="font-family: 'Anton', sans-serif; font-size: 28px; line-height: 1; text-transform: uppercase; letter-spacing: 0.02em">Game over.</span>
<div style="display: flex; align-items: flex-end; gap: 14px">
<span style="font-family: 'Anton', sans-serif; font-size: 132px; line-height: 0.85; color: #E4572E">5</span>
<span style="font-family: 'Anton', sans-serif; font-size: 28px; line-height: 1; text-transform: uppercase; padding-bottom: 6px">Song<br>streak</span>
</div>
</div>

<div style="height: 104px; box-sizing: border-box; border-radius: 20px; border: 2.5px solid #1C1C1F; background: #F8F6F2; padding: 12px 14px; display: flex; flex-direction: column; justify-content: space-between">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #55555C">Your best</span>
<span style="font-family: 'Anton', sans-serif; font-size: 50px; line-height: 1">11</span>
</div>

<div style="height: 104px; box-sizing: border-box; border-radius: 20px; border: 2.5px solid #1C1C1F; background: #E4572E; padding: 12px 14px; display: flex; flex-direction: column; justify-content: space-between">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase">Fan level</span>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Anton', sans-serif; font-size: 32px; line-height: 1; text-transform: uppercase">Roadie</span>
<span style="font-size: 12px; font-weight: 600">3 more for Tour manager</span>
</div>
</div>

<div style="grid-column: span 2; box-sizing: border-box; border-radius: 20px; border: 2.5px solid #1C1C1F; background: #F8F6F2; padding: 10px; display: flex; align-items: center; gap: 12px">
<img src="../prototype/assets/black-album.jpg" alt="Metallica (The Black Album) cover" style="width: 60px; height: 60px; flex-shrink: 0; border-radius: 12px; object-fit: cover; display: block">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #B13E1C">The one that got you</span>
<span style="font-family: 'Anton', sans-serif; font-size: 26px; line-height: 1.05; text-transform: uppercase">Sad but True</span>
<span style="font-size: 13px; font-weight: 500">You said higher than 1,500. Played 1,443.</span>
</div>
</div>

</div>

<div style="margin-top: 16px; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #55555C">Your run</div>
<div style="margin-top: 10px; display: flex; gap: 8px">
<sc-for list="{{run}}" as="item" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<div role="img" aria-label="{{item.label}}" style="{{item.tile}}">
<sc-if value="{{item.cover}}" hint-placeholder-val="{{false}}">
<img src="{{item.img}}" alt="" style="width: 100%; height: 100%; object-fit: cover; border-radius: 9px; display: block">
</sc-if>
<span style="{{item.badge}}">
<sc-if value="{{item.ok}}" hint-placeholder-val="{{true}}">
<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#1C1C1F" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</sc-if>
<sc-if value="{{item.miss}}" hint-placeholder-val="{{false}}">
<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#F8F6F2" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</sc-if>
</span>
</div>
<span style="font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums">{{item.count}}</span>
</div>
</sc-for>
</div>

<button type="button" style="margin-top: 18px; height: 58px; border: 0; border-radius: 29px; background: #1C1C1F; color: #F8F6F2; font-family: 'Anton', sans-serif; font-size: 24px; text-transform: uppercase; letter-spacing: 0.03em">Play Metallica again</button>
<div style="margin-top: 8px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" style="height: 50px; box-sizing: border-box; border: 2.5px solid #1C1C1F; border-radius: 25px; background: #F8F6F2; color: #1C1C1F; font-family: 'Schibsted Grotesk', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase">Share streak</button>
<a href="HLHome.dc.html" style="height: 50px; box-sizing: border-box; border: 2.5px solid #1C1C1F; border-radius: 25px; background: #F8F6F2; color: #1C1C1F; text-decoration: none; font-family: 'Schibsted Grotesk', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; display: flex; align-items: center; justify-content: center">New band</a>
</div>

<div style="margin-top: auto; text-align: center; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #55555C">Counts from <a href="https://www.setlist.fm" style="color: #1C1C1F">setlist.fm</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var songs = [
{ song: 'One', count: '1,646', fill: '#2B2B30', ok: true, img: '../prototype/assets/ajfa.jpg' },
{ song: 'Fade to Black', count: '1,286', fill: '#ECE9E3', ok: true },
{ song: 'Creeping Death', count: '1,683', fill: '#ECE9E3', ok: true },
{ song: 'Enter Sandman', count: '1,464', fill: '#2B2B30', ok: true, img: '../prototype/assets/black-album.jpg' },
{ song: 'Master of Puppets', count: '1,803', fill: '#F8F6F2', ok: true, img: '../prototype/assets/master-of-puppets.png' },
{ song: 'Sad but True', count: '1,443', fill: '#2B2B30', ok: false, img: '../prototype/assets/black-album.jpg' }
];
var run = songs.map(function (s) {
var dots = s.fill === '#2B2B30' ? 'rgba(248,246,242,.16)' : 'rgba(28,28,31,.14)';
return {
label: s.song + (s.ok ? ', correct' : ', wrong'),
count: s.count,
ok: s.ok,
miss: !s.ok,
cover: !!s.img,
img: s.img || '',
tile: 'width: 52px; height: 52px; box-sizing: border-box; position: relative; border-radius: 12px; border: 2.5px solid #1C1C1F; background-color: ' + s.fill + '; background-image: radial-gradient(' + dots + ' 1.3px, transparent 1.5px); background-size: 6px 6px' + (s.ok ? '' : '; box-shadow: 3px 3px 0 #E4572E'),
badge: 'position: absolute; top: -8px; right: -8px; width: 22px; height: 22px; box-sizing: border-box; border-radius: 11px; display: flex; align-items: center; justify-content: center; border: 2px solid #1C1C1F; background: ' + (s.ok ? '#E4572E' : '#1C1C1F')
};
});
return { run: run };
}
}
</script>
</body>
</html>
